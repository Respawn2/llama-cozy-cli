name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bash syntax
        run: |
          for f in bin/llama-cozy install.sh completions/ai.bash; do
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck -S warning bin/llama-cozy install.sh completions/ai.bash

      - name: fish and zsh completion syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish zsh
          fish --no-execute completions/ai.fish
          zsh -n completions/_ai

      - name: version and help
        run: |
          bash bin/llama-cozy --version
          bash bin/llama-cozy version
          bash bin/llama-cozy --help > /dev/null

      - name: config is parsed, never executed
        run: |
          export XDG_CONFIG_HOME="$PWD/.ci-config"
          mkdir -p "$XDG_CONFIG_HOME/llama-cozy"
          rm -f /tmp/llama-cozy-pwned
          {
            echo '# comment'
            echo 'CTX=2048'
            echo 'SYSTEM_PROMPT=$(touch /tmp/llama-cozy-pwned)'
          } > "$XDG_CONFIG_HOME/llama-cozy/config"
          test "$(bash bin/llama-cozy config get CTX)" = "2048"
          test "$(bash bin/llama-cozy config get SYSTEM_PROMPT)" = '$(touch /tmp/llama-cozy-pwned)'
          test ! -e /tmp/llama-cozy-pwned

  smoke:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-latest, fedora]
    runs-on: ubuntu-latest
    container: ${{ matrix.image == 'fedora' && 'fedora:latest' || '' }}
    steps:
      - name: fedora prerequisites
        if: matrix.image == 'fedora'
        run: dnf install -y -q git findutils procps-ng

      - uses: actions/checkout@v5

      - name: install, use, uninstall (stub llama-cli)
        run: |
          export HOME="$PWD/.ci-home"
          mkdir -p "$HOME/stub" "$HOME/models/org/repo"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME

          # fake llama.cpp: just echoes its arguments
          printf '#!/bin/sh\necho "STUB:" "$@"\n' > "$HOME/stub/llama-cli"
          chmod +x "$HOME/stub/llama-cli"
          export PATH="$HOME/stub:$PATH"

          : > "$HOME/models/org/repo/Qwen3-8B-Q4_K_M.gguf"
          : > "$HOME/models/org/repo/mmproj-F16.gguf"
          : > "$HOME/models/org/repo/big-00001-of-00002.gguf"
          : > "$HOME/models/org/repo/big-00002-of-00002.gguf"

          bash install.sh --yes --prefix "$PWD/.ci-prefix" --models-dir "$HOME/models"
          export PATH="$PWD/.ci-prefix/bin:$PATH"

          test -x .ci-prefix/bin/llama-cozy
          test -L .ci-prefix/bin/ai
          test -L .ci-prefix/bin/ailist
          ai --version

          # list: no mmproj, no extra shards
          ailist | grep -q Qwen3-8B-Q4_K_M
          ai list --names | grep -q Qwen3-8B-Q4_K_M
          test "$(ai list --names | wc -l)" = 2
          if ai list --names | grep -qi mmproj; then echo 'mmproj leaked into list'; exit 1; fi

          # run builds the right command line
          ai qwen 8b q4 </dev/null 2>/dev/null | grep -q -- '-m .*Qwen3-8B-Q4_K_M.gguf'
          ai qwen -p "hi" --cpu </dev/null 2>/dev/null | grep -q -- '-ngl 0'
          if ai nonexistent </dev/null 2>/dev/null; then echo 'bogus model should fail'; exit 1; fi

          # config roundtrip
          ai config set CTX 1024
          test "$(ai config get CTX)" = 1024

          ai doctor || true

          bash install.sh --uninstall --prefix "$PWD/.ci-prefix"
          test ! -e .ci-prefix/bin/llama-cozy
          test ! -e .ci-prefix/bin/ai
          test -e "$HOME/models/org/repo/Qwen3-8B-Q4_K_M.gguf"
